name: Update visual baselines

# Manually triggered. Vitest's toMatchScreenshot() scopes baseline filenames by platform
# (`-chromium-<platform>.png`) since font rendering/antialiasing differs across OSes, so
# baselines generated on a dev machine (e.g. win32) never match what the "test" job in
# ci.yml produces on ubuntu-latest. Run this after adding/changing a component (or the
# first time a platform's baselines go missing) to generate ones that match CI, then
# review and merge the resulting PR. See docs/visual-regression.md.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bunx playwright install --with-deps chromium

      - run: bun run test:visual:update

      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update visual regression baselines (linux)"
          title: "Update visual regression baselines (linux)"
          body: |
            Auto-generated by the "Update visual baselines" workflow, running on
            `ubuntu-latest` to match the main CI job's platform.

            Review the diffs under `src/test-utils/__screenshots__/` before merging —
            only baselines for components that actually changed (or platform-scoped
            baselines that were missing) should show up. See docs/visual-regression.md.
          branch: update-visual-baselines
          add-paths: src/test-utils/__screenshots__/
